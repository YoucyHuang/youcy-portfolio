<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 600" width="760" height="600"><title>Plan</title><defs>
<linearGradient id="rust" x1="0" x2="1"><stop offset="0" stop-color="#5E2F18"/><stop offset=".35" stop-color="#B4683A"/><stop offset=".7" stop-color="#8A4B2A"/><stop offset="1" stop-color="#4A2412"/></linearGradient>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 .3  0 0 0 0 .15  0 0 0 0 .05  0 0 0 .35 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#2A2622" stroke-width="1.2"/></marker>
<marker id="tick" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2 8 L8 2" stroke="#2A2622" stroke-width="1.2"/></marker>
</defs><rect width="760" height="600" fill="#F6F3EE"/><path d="M185.0 200 Q380.0 470.0 575.0 200" fill="none" stroke="#2A2622" stroke-width="3"/><path d="M185.0 162.5 Q380.0 432.5 575.0 162.5" fill="none" stroke="#2A2622" stroke-width="3" opacity=".5"/><rect x="170" y="185.0" width="30.0" height="30.0" fill="url(#rust)" stroke="#3A1E10" stroke-width=".8"/><rect x="560.0" y="185.0" width="30.0" height="30.0" fill="url(#rust)" stroke="#3A1E10" stroke-width=".8"/><line x1="170" y1="125.0" x2="590.0" y2="125.0" stroke="#2A2622" stroke-width="1" marker-start="url(#tick)" marker-end="url(#tick)"/><text x="380.0" y="117.0" font-family="Georgia,serif" font-size="15" fill="#2A2622" text-anchor="middle">2.8 m</text><line x1="642.5" y1="185.0" x2="642.5" y2="335.0" stroke="#2A2622" stroke-width="1" marker-start="url(#tick)" marker-end="url(#tick)"/><text x="652.5" y="260.0" font-family="Georgia,serif" font-size="15" fill="#2A2622" transform="rotate(-90 652.5 260.0)" text-anchor="middle" dy="-4">1 m</text><line x1="590.0" y1="185.0" x2="650.0" y2="185.0" stroke="#8C857C" stroke-width=".6" stroke-dasharray="3 3"/><line x1="380.0" y1="335.0" x2="650.0" y2="335.0" stroke="#8C857C" stroke-width=".6" stroke-dasharray="3 3"/><line x1="380.0" y1="297.5" x2="380.0" y2="335.0" stroke="#2A2622" stroke-width="1" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="390.0" y="321.25" font-family="Georgia,serif" font-size="14" fill="#2A2622">25 cm</text><text x="380.0" y="234" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" fill="#5D7A45" text-anchor="middle">凹面一侧：被画面环抱</text><text x="380.0" y="250" font-family="'EB Garamond',Georgia,serif" font-style="italic" font-size="12" fill="#8C857C" text-anchor="middle">Concave side: held within the painting</text><path d="M380.0 427.0 L380.0 349.0" stroke="#8A4B2A" stroke-width="1.4" marker-end="url(#ar)"/><text x="380.0" y="451.0" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" fill="#8A4B2A" text-anchor="middle">凸面一侧：画面向人所在的空间施压</text><text x="380.0" y="467.0" font-family="'EB Garamond',Georgia,serif" font-style="italic" font-size="12" fill="#8C857C" text-anchor="middle">Convex side: the painting presses into the viewer’s space</text><text x="30" y="196" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#2A2622" text-anchor="start">耐候钢空心立柱</text><text x="30" y="210" font-family="'EB Garamond',Georgia,serif" font-style="italic" font-size="10" fill="#8C857C" text-anchor="start">Hollow steel column</text><text x="30" y="222" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#2A2622" text-anchor="start">0.2 × 0.2 m</text><text x="30" y="236" font-family="'EB Garamond',Georgia,serif" font-style="italic" font-size="10" fill="#8C857C" text-anchor="start"></text><text x="40" y="50" font-family="'Noto Serif SC','Songti SC',serif" font-size="20" fill="#2A2622" text-anchor="start">平面</text><text x="40" y="72" font-family="'EB Garamond',Georgia,serif" font-style="italic" font-size="18" fill="#8C857C" text-anchor="start">Plan</text><text x="40" y="560" font-family="'Noto Serif SC','Songti SC',serif" font-size="13" fill="#2A2622" text-anchor="start">两层涤纶画布，中间留 25 cm；底部为 U 形支撑</text><text x="40" y="575" font-family="'EB Garamond',Georgia,serif" font-style="italic" font-size="11" fill="#8C857C" text-anchor="start">Two polyester canvases 25 cm apart, on a U-shaped base</text></svg>