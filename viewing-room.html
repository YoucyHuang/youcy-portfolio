<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Youcy Huang · Paintings</title>
<meta name="description" content="Youcy Huang 黄鈺茜 — Paintings, 2021–2026. Online viewing room.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500&display=swap">
<style>
/* 商业画廊在线展厅式的绘画作品集：大留白、无衬线、作品一屏一幅、展签式说明 */
:root{
  --paper:#FFFFFF; --wall:#F2F1EE; --ink:#111111; --ink2:#5C5C5A; --ink3:#9A9995; --rule:#E3E2DE;
  --sans:"Inter","Helvetica Neue",Helvetica,Arial,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --gut:clamp(16px,4vw,64px); --bar:64px;
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--bar) + 12px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:300;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:clip}
:lang(zh-CN) body{font-size:15px;line-height:1.8}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img{display:block;max-width:100%}
:focus-visible{outline:1px solid var(--ink);outline-offset:4px}
.wrap{padding-inline:var(--gut)}
.lbl{font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
:lang(zh-CN) .lbl{letter-spacing:.2em}

/* 顶栏 */
.bar{position:sticky;top:0;z-index:20;height:var(--bar);display:flex;align-items:center;justify-content:space-between;gap:24px;
  background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .3s}
.bar.lined{border-bottom-color:var(--rule)}
.brand{font-size:13px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;white-space:nowrap}
.nav{display:flex;align-items:center;gap:clamp(14px,2vw,28px);overflow-x:auto;scrollbar-width:none;font-size:12.5px;color:var(--ink2)}
.nav::-webkit-scrollbar{display:none}
.nav a{white-space:nowrap;padding-block:6px;border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
.nav a:hover,.nav a.on{color:var(--ink);border-bottom-color:var(--ink)}
.lang{display:flex;gap:10px;padding-left:clamp(10px,1.6vw,20px);border-left:1px solid var(--rule);font-size:12px}
.lang button{color:var(--ink3)} .lang button[aria-pressed="true"]{color:var(--ink)}
@media (max-width:820px){.nav .sec-link{display:none}}

/* 封面 */
.cover{padding-top:clamp(48px,9vh,110px)}
.cover-t{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px 40px;align-items:end;padding-bottom:clamp(28px,5vh,56px)}
.cover h1{margin:0;font-weight:300;font-size:clamp(46px,9vw,148px);line-height:.92;letter-spacing:-.025em}
.cover h1 small{display:block;margin-top:.28em;font-size:max(15px,.2em);letter-spacing:0;color:var(--ink2);font-weight:300}
.cover-meta{display:grid;gap:4px;text-align:right;font-size:13px;color:var(--ink2);padding-bottom:6px}
@media (max-width:700px){.cover-t{grid-template-columns:1fr}.cover-meta{text-align:left}}
/* 封面用山水 06 这幅长卷：完整显示、铺满宽度，不裁切 */
.cover-img{position:relative;margin:0}
.cover-img img{width:100%;height:auto;max-height:78vh;object-fit:contain;object-position:left center}
.cover-cap{display:flex;justify-content:space-between;gap:16px;padding-top:12px;font-size:12.5px;color:var(--ink2)}
.cover-cap i{font-style:italic;color:var(--ink)}

/* 前言 */
.intro{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:24px clamp(32px,7vw,120px);padding-block:clamp(80px,14vh,170px)}
.intro p{margin:0 0 1.1em;font-size:clamp(17px,1.55vw,22px);line-height:1.6;color:var(--ink)}
:lang(zh-CN) .intro p{font-size:clamp(16px,1.4vw,19px);line-height:1.95}
.intro p:last-child{margin:0}
@media (max-width:820px){.intro{grid-template-columns:1fr}}

/* 系列 */
.sec{padding-top:clamp(60px,10vh,120px);border-top:1px solid var(--rule)}
.sec-h{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 40px;align-items:end}
.sec-h h2{margin:0;font-weight:300;font-size:clamp(40px,6.4vw,104px);line-height:.95;letter-spacing:-.02em}
.sec-h h2 span{display:block;margin-top:.35em;font-size:max(13px,.2em);letter-spacing:.06em;color:var(--ink2)}
.sec-meta{display:grid;gap:4px;text-align:right;font-size:13px;color:var(--ink2);padding-bottom:4px}
.sec-say{max-width:44em;margin-top:clamp(28px,4vh,44px);color:var(--ink2);font-size:15.5px}
.sec-say p{margin:0 0 .9em}
@media (max-width:700px){.sec-h{grid-template-columns:1fr}.sec-meta{text-align:left}}

/* 作品：一屏一幅 / 两幅并排 */
.plates{display:grid;gap:clamp(56px,10vh,120px);padding-block:clamp(48px,8vh,96px) clamp(80px,14vh,160px)}
.plate{display:grid;gap:18px;opacity:1}
.stage{display:grid;place-items:center;background:var(--wall);padding:clamp(28px,7vh,96px) clamp(20px,6vw,120px);min-height:min(86vh,980px);cursor:zoom-in}
.stage img{max-height:min(70vh,820px);width:auto;height:auto;box-shadow:0 1px 2px rgba(0,0,0,.06),0 18px 40px -22px rgba(0,0,0,.28);transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.stage:hover img{transform:scale(1.008)}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(16px,2.4vw,36px)}
.duo .stage{min-height:min(68vh,760px);padding:clamp(22px,5vh,64px) clamp(16px,4vw,64px)}
.duo .stage img{max-height:min(52vh,620px)}
@media (max-width:760px){.duo{grid-template-columns:1fr}.stage{min-height:auto;padding:28px 18px}.stage img{max-height:64vh}.duo .stage{min-height:auto}}
.tag{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 24px;align-items:start;font-size:13.5px;line-height:1.55}
.tag .who{color:var(--ink)}
.tag .t i{font-style:italic}
:lang(zh-CN) .tag .t i{font-style:normal}
.tag .m{color:var(--ink2)}
.tag .no{font-size:11px;letter-spacing:.12em;color:var(--ink3);margin-bottom:6px}
.acts{display:flex;gap:18px;font-size:12.5px;white-space:nowrap}
.acts a,.acts button{border-bottom:1px solid var(--ink);padding-bottom:1px}
.acts a:hover,.acts button:hover{color:var(--ink2);border-color:var(--ink2)}
.dets{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.dets button{display:block;background:var(--wall);padding:6px}
.dets img{height:64px;width:auto}

/* 作品清单 */
.check{padding-block:clamp(70px,12vh,140px);border-top:1px solid var(--rule)}
.check h2{margin:0 0 clamp(28px,5vh,56px);font-weight:300;font-size:clamp(32px,4vw,60px);letter-spacing:-.015em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:36px clamp(16px,2vw,28px)}
.cell{display:grid;gap:10px;text-align:left}
.cell .th{aspect-ratio:1;background:var(--wall);display:grid;place-items:center;padding:12%}
.cell .th img{max-height:100%;width:auto;height:auto;object-fit:contain}
.cell .ct{font-size:12px;line-height:1.5;color:var(--ink2)}
.cell .ct b{display:block;font-weight:400;color:var(--ink)}
.cell:hover .ct b{text-decoration:underline;text-underline-offset:3px}

/* 页脚 */
.foot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;padding-block:48px 64px;border-top:1px solid var(--rule);font-size:13px;color:var(--ink2)}
.foot a{border-bottom:1px solid var(--rule)}
.foot a:hover{color:var(--ink);border-color:var(--ink)}
@media (max-width:700px){.foot{grid-template-columns:1fr}}

/* 全屏查看 */
.lb{position:fixed;inset:0;z-index:50;background:#fff;display:grid;grid-template-rows:minmax(0,1fr) auto;padding:calc(env(safe-area-inset-top,0px) + 20px) var(--gut) calc(env(safe-area-inset-bottom,0px) + 16px)}
.lb[hidden]{display:none}
.lb img{width:100%;height:100%;object-fit:contain;min-height:0}
.lb-bar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-top:14px;font-size:13px;color:var(--ink2)}
.lb-bar i{font-style:italic;color:var(--ink)}
.lb-nav{display:flex;gap:22px;align-items:center}
.lb-nav button{font-size:13px;border-bottom:1px solid var(--ink)}
.lb-nav button[disabled]{opacity:.25;cursor:default}

/* 进入视口时淡入 */
.rv{opacity:0;transform:translateY(18px);transition:opacity 1s ease,transform 1.1s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.rv{opacity:1;transform:none;transition:none}.stage img{transition:none}}
</style>
</head>
<body>
<header class="bar wrap" id="bar">
  <a class="brand" href="#top">Youcy Huang</a>
  <nav class="nav" id="nav" aria-label="Sections"></nav>
</header>
<main id="top"></main>
<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Artwork">
  <img id="lbImg" alt="">
  <div class="lb-bar"><span id="lbCap"></span><span class="lb-nav"><button id="lbPrev">←</button><button id="lbNext">→</button><button id="lbClose" data-t="close"></button></span></div>
</div>

<script src="paintings.js?v=vr1"></script>
<script src="profile.js?v=vr1"></script>
<script>
(()=>{
const P=window.PAINTINGS||[],SER=window.PSERIES||[],PF=window.PROFILE||{};
const IMGV='vr1';
const MED={'纸上水彩':'Watercolour on paper','纸面水彩':'Watercolour on paper','纸上综合材料':'Mixed media on paper','纸上油画棒':'Oil pastel on paper','纸上丙烯':'Acrylic on paper','布面丙烯':'Acrylic on canvas','布面综合材料':'Mixed media on canvas','PE布面综合材料':'Mixed media on PE canvas','铜板飞尘':'Aquatint on copper','铜板线腐蚀':'Line etching on copper'};
/* 展厅里各系列的顺序、名字和一句话说明（本真、山水用作者的创作自述） */
const ORDER=['A2','A1','W','D','S','E'];
const NAME={A2:['Authenticity','本真'],A1:['Shanshui','山水'],W:['Watercolours','水彩'],D:['Everyday','日常'],S:['Drawings','素描与速写'],E:['Prints','版画']};
const SAY={W:[['Watercolours on paper: the figure, and colour finding its way across the sheet.'],['纸上水彩：人体，以及在纸面上流动的颜色。']],
  D:[['Still lifes, landscapes and the people close by — painting as a daily practice.'],['静物、风景与身边的人——作为日常练习的绘画。']],
  S:[['Drawings and portrait studies in pencil, charcoal and oil pastel.'],['铅笔、炭笔与油画棒的素描和肖像习作。']],
  E:[['Copperplate prints: aquatint and line etching.'],['铜版画：飞尘与线腐蚀。']]};
const ONEUP=new Set(['A2','A1']);   /* 布面绘画一屏一幅；纸本两幅并排 */
const EMAIL=(PF.email||'lunahyx7@gmail.com');

let lang='en';try{lang=localStorage.getItem('vr-lang')||'en'}catch(e){}
const L=a=>Array.isArray(a)?a[lang==='en'?0:1]:a;   /* 本页文案：[英, 中] */
const LP=a=>Array.isArray(a)?a[lang==='en'?1:0]:a;  /* profile.js 里的创作自述：[中, 英] */
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const T={works:[n=>`${n} works`,n=>`${n} 件`],paintings:['Paintings','绘画'],view:['View','查看'],inquire:['Inquire','咨询'],details:['Details','局部'],
  checklist:['Checklist','作品清单'],close:['Close','关闭'],about:['About the work','关于作品'],site:['Main website','个人主页'],
  contact:['Enquiries','联系'],viewing:['Online viewing room','在线展厅']};
const img=(w,s)=>`paint/${s}/${w.code}.jpg?v=${IMGV}`;
const title=w=>lang==='en'?w.title[1]:w.title[0];
const med=w=>w.medium?(lang==='en'?(MED[w.medium]||w.medium):w.medium):'';
const size=w=>w.w&&w.h?(lang==='en'?`${w.w} × ${w.h} cm`:`${w.w} × ${w.h} 厘米`):'';
const years=l=>{const y=l.map(x=>x.year).filter(Boolean);if(!y.length)return '';const a=Math.min(...y),b=Math.max(...y);return a===b?`${a}`:`${a}–${b}`};
const series=ORDER.map(k=>({key:k,works:P.filter(w=>w.series===k)})).filter(s=>s.works.length);
const all=series.flatMap(s=>s.works);
const pad=n=>String(n).padStart(2,'0');

function tag(w,i){
  const meta=[med(w),size(w)].filter(Boolean);
  const subj=encodeURIComponent(`Inquiry: ${w.title[1]}${w.year?', '+w.year:''} — Youcy Huang`);
  return `<div class="tag">
    <div><div class="no">${pad(i+1)}</div><div class="who">${lang==='en'?'Youcy Huang':'黄鈺茜'}</div>
      <div class="t"><i>${esc(title(w))}</i>${w.year?`, ${w.year}`:''}</div>${meta.map(m=>`<div class="m">${esc(m)}</div>`).join('')}</div>
    <div class="acts"><button data-view="${w.id}">${L(T.view)}</button><a href="mailto:${EMAIL}?subject=${subj}">${L(T.inquire)}</a></div>
    ${w.det&&w.det.length?`<div class="dets" aria-label="${L(T.details)}">${w.det.map((d,j)=>`<button data-view="${w.id}~${j}" aria-label="${L(T.details)} ${j+1}"><img src="paint/thumb/${d}.jpg?v=${IMGV}" alt="" loading="lazy"></button>`).join('')}</div>`:''}
  </div>`;
}
const plate=(w,i,size)=>`<article class="plate rv" id="w-${w.id}"><div class="stage" data-view="${w.id}"><img src="${img(w,size)}" alt="${esc(title(w))}" loading="lazy" width="${w.px[0]}" height="${w.px[1]}"></div>${tag(w,i)}</article>`;

function render(){
  document.documentElement.lang=lang==='en'?'en':'zh-CN';
  document.title=lang==='en'?'Youcy Huang · Paintings':'黄鈺茜 · 绘画';
  let idx=0;
  const cover=P.find(w=>w.code==='c9')||all[0];
  /* 前言用山水自述的前两段；第三段放进山水系列里，本真自述放进本真系列里，不重复 */
  const intro=PF.statements&&PF.statements.shanshui?LP(PF.statements.shanshui).slice(0,2):[];
  let html=`<section class="cover wrap">
      <div class="cover-t"><h1>${lang==='en'?'Youcy Huang':'黄鈺茜'}<small>${L(T.paintings)}, ${years(all)}</small></h1>
        <div class="cover-meta"><span class="lbl">${L(T.viewing)}</span><span>${L(T.works)(all.length)}</span></div></div>
      <figure class="cover-img"><img src="${img(cover,'full')}" alt="${esc(title(cover))}"></figure>
      <div class="cover-cap"><span><i>${esc(title(cover))}</i>${cover.year?`, ${cover.year}`:''}</span><span>${esc(med(cover))}</span></div>
    </section>
    <section class="intro wrap rv"><span class="lbl">${L(T.about)}</span><div>${intro.map(p=>`<p>${esc(p)}</p>`).join('')}</div></section>`;
  for(const s of series){
    const say=s.key==='A2'?(PF.statements&&LP(PF.statements.benzhen)):s.key==='A1'?(PF.statements&&LP(PF.statements.shanshui).slice(2)):L(SAY[s.key]||[[],[]]);
    html+=`<section class="sec wrap" id="${s.key}"><div class="sec-h rv"><h2>${NAME[s.key][lang==='en'?0:1]}<span>${lang==='en'?NAME[s.key][1]:NAME[s.key][0]}</span></h2>
        <div class="sec-meta"><span class="lbl">${years(s.works)}</span><span>${L(T.works)(s.works.length)}</span></div></div>
      ${say&&say.length?`<div class="sec-say rv">${say.map(p=>`<p>${esc(p)}</p>`).join('')}</div>`:''}<div class="plates">`;
    if(ONEUP.has(s.key))s.works.forEach(w=>{html+=plate(w,idx++,'full')});
    else for(let i=0;i<s.works.length;i+=2){
      const pair=s.works.slice(i,i+2);
      html+=`<div class="duo">${pair.map(w=>plate(w,idx++,'thumb')).join('')}</div>`;
    }
    html+=`</div></section>`;
  }
  html+=`<section class="check wrap" id="checklist"><h2>${L(T.checklist)}</h2><div class="grid">${all.map((w,i)=>`<a class="cell" href="#w-${w.id}"><span class="th"><img src="${img(w,'thumb')}" alt="" loading="lazy"></span>
      <span class="ct"><b>${pad(i+1)} · ${esc(title(w))}</b>${[w.year,med(w),size(w)].filter(Boolean).map(esc).join(' · ')}</span></a>`).join('')}</div></section>
    <footer class="foot wrap"><div><div class="lbl" style="margin-bottom:8px">${L(T.contact)}</div><a href="mailto:${EMAIL}">${EMAIL}</a></div>
      <div style="text-align:right"><a href="./">${L(T.site)} →</a><div style="margin-top:8px">© ${lang==='en'?'Youcy Huang':'黄鈺茜'} ${new Date().getFullYear()}</div></div></footer>`;
  document.getElementById('top').innerHTML=html;
  document.getElementById('nav').innerHTML=series.map(s=>`<a class="sec-link" href="#${s.key}" data-sec="${s.key}">${NAME[s.key][lang==='en'?0:1]}</a>`).join('')
    +`<a href="#checklist" data-sec="checklist">${L(T.checklist)}</a><span class="lang"><button data-lang="en" aria-pressed="${lang==='en'}">EN</button><button data-lang="zh" aria-pressed="${lang!=='en'}">中</button></span>`;
  document.querySelectorAll('[data-t="close"]').forEach(b=>b.textContent=L(T.close));
  reveal();spy();
}

/* 进入视口淡入 */
let io;
function reveal(){
  if(io)io.disconnect();
  if(!('IntersectionObserver' in window)||matchMedia('(prefers-reduced-motion: reduce)').matches){document.querySelectorAll('.rv').forEach(e=>e.classList.add('in'));return}
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{rootMargin:'0px 0px -8% 0px'});
  document.querySelectorAll('.rv').forEach(e=>io.observe(e));
}
/* 顶栏高亮当前系列 */
let spyIO;
function spy(){
  if(spyIO)spyIO.disconnect();if(!('IntersectionObserver' in window))return;
  spyIO=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)document.querySelectorAll('[data-sec]').forEach(a=>a.classList.toggle('on',a.dataset.sec===e.target.id))}),{rootMargin:'-45% 0px -50% 0px'});
  document.querySelectorAll('.sec,.check').forEach(s=>spyIO.observe(s));
}
addEventListener('scroll',()=>document.getElementById('bar').classList.toggle('lined',scrollY>40),{passive:true});

/* 全屏查看：作品和局部按顺序翻 */
const views=[];all.forEach(w=>{views.push({key:w.id,w,src:img(w,'full')});(w.det||[]).forEach((d,j)=>views.push({key:`${w.id}~${j}`,w,src:`paint/full/${d}.jpg?v=${IMGV}`,det:j+1}))});
let cur=-1;
const lb=document.getElementById('lb'),lbImg=document.getElementById('lbImg'),lbCap=document.getElementById('lbCap');
function show(i){
  cur=Math.max(0,Math.min(views.length-1,i));const v=views[cur];
  lbImg.src=v.src;lbImg.alt=title(v.w);
  lbCap.innerHTML=`<i>${esc(title(v.w))}</i>${v.w.year?`, ${v.w.year}`:''}${v.det?` · ${L(T.details)} ${v.det}`:''}${med(v.w)?` · ${esc(med(v.w))}`:''}${size(v.w)?` · ${esc(size(v.w))}`:''}`;
  document.getElementById('lbPrev').disabled=cur===0;document.getElementById('lbNext').disabled=cur===views.length-1;
}
function open(key){const i=views.findIndex(v=>v.key===key);if(i<0)return;show(i);lb.hidden=false;document.body.style.overflow='hidden';document.getElementById('lbClose').focus()}
function close(){lb.hidden=true;document.body.style.overflow=''}
function jump(id,smooth){const t=document.getElementById(id);if(!t)return;t.querySelectorAll('.rv').forEach(x=>x.classList.add('in'));t.classList.add('in');
  /* 远距离直接跳过去，近距离才平滑滚动（页面很长，长距离平滑滚动容易被打断） */
  const y=t.getBoundingClientRect().top+scrollY-(document.getElementById('bar').offsetHeight+12);
  const near=Math.abs(y-scrollY)<innerHeight*3&&smooth&&!matchMedia('(prefers-reduced-motion: reduce)').matches;
  scrollTo({top:y,behavior:near?'smooth':'instant'})}
document.addEventListener('click',e=>{
  const v=e.target.closest('[data-view]');if(v){e.preventDefault();open(v.dataset.view);return}
  const h=e.target.closest('a[href^="#"]');if(h&&h.getAttribute('href').length>1){e.preventDefault();const id=h.getAttribute('href').slice(1);jump(id,true);history.replaceState(null,'','#'+id);return}
  const l=e.target.closest('[data-lang]');if(l&&l.dataset.lang!==lang){lang=l.dataset.lang;try{localStorage.setItem('vr-lang',lang)}catch(err){}const y=scrollY;render();scrollTo(0,y)}
});
document.getElementById('lbPrev').onclick=()=>show(cur-1);document.getElementById('lbNext').onclick=()=>show(cur+1);document.getElementById('lbClose').onclick=close;
lb.addEventListener('click',e=>{if(e.target===lb||e.target===lbImg)close()});
document.addEventListener('keydown',e=>{if(lb.hidden)return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')show(cur-1);if(e.key==='ArrowRight')show(cur+1)});
let x0=null;lb.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
lb.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>40)show(cur+(dx<0?1:-1));x0=null});

render();
if(location.hash.length>1)requestAnimationFrame(()=>jump(decodeURIComponent(location.hash.slice(1)),false));
})();
</script>
</body>
</html>
