<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 600" width="760" height="600"><title>Section and light</title><defs>
<linearGradient id="rust" x1="0" x2="1"><stop offset="0" stop-color="#5E2F18"/><stop offset=".35" stop-color="#B4683A"/><stop offset=".7" stop-color="#8A4B2A"/><stop offset="1" stop-color="#4A2412"/></linearGradient>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 .3  0 0 0 0 .15  0 0 0 0 .05  0 0 0 .35 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#2A2622" stroke-width="1.2"/></marker>
<marker id="tick" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2 8 L8 2" stroke="#2A2622" stroke-width="1.2"/></marker>
</defs><rect width="760" height="600" fill="#F6F3EE"/><line x1="40" y1="508" x2="720" y2="508" stroke="#2A2622" stroke-width="1.2"/><path d="M305.0 508 L305.0 496 L492.5 496 L492.5 508" fill="none" stroke="#8A4B2A" stroke-width="3"/><path d="M380 496 C390 356.0 372 248.00000000000003 384 140.0" fill="none" stroke="#2A2622" stroke-width="3" opacity="1"/><path d="M417.5 496 C427.5 356.0 409.5 248.00000000000003 421.5 140.0" fill="none" stroke="#2A2622" stroke-width="3" opacity="0.55"/><circle cx="650" cy="90" r="26" fill="#E9B86A" opacity=".85"/><line x1="630" y1="110" x2="260" y2="530" stroke="#E2A24E" stroke-width="1.2" opacity="0.75" stroke-dasharray="2 5"/><line x1="630" y1="110" x2="260" y2="484" stroke="#E2A24E" stroke-width="1.2" opacity="0.69" stroke-dasharray="2 5"/><line x1="630" y1="110" x2="260" y2="438" stroke="#E2A24E" stroke-width="1.2" opacity="0.63" stroke-dasharray="2 5"/><line x1="630" y1="110" x2="260" y2="392" stroke="#E2A24E" stroke-width="1.2" opacity="0.57" stroke-dasharray="2 5"/><line x1="630" y1="110" x2="260" y2="346" stroke="#E2A24E" stroke-width="1.2" opacity="0.51" stroke-dasharray="2 5"/><line x1="630" y1="110" x2="260" y2="300" stroke="#E2A24E" stroke-width="1.2" opacity="0.45" stroke-dasharray="2 5"/><line x1="630" y1="110" x2="260" y2="254" stroke="#E2A24E" stroke-width="1.2" opacity="0.39" stroke-dasharray="2 5"/><circle cx="150" cy="350" r="11" fill="none" stroke="#2A2622" stroke-width="1.4"/><path d="M150 362 L150 438 M150 388 L132 416 M150 388 L168 412 M150 438 L136 508 M150 438 L164 508" stroke="#2A2622" stroke-width="1.4" fill="none"/><path d="M164 348 L374 310" stroke="#8C857C" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#ar)"/><text x="450" y="210" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" fill="#2A2622" text-anchor="start">阳光穿过两层画布</text><text x="450" y="226" font-family="'EB Garamond',Georgia,serif" font-style="italic" font-size="12" fill="#8C857C" text-anchor="start">Sunlight passes through both canvases</text><text x="450" y="260" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" fill="#2A2622" text-anchor="start">后面的笔迹在前面隐约浮现</text><text x="450" y="276" font-family="'EB Garamond',Georgia,serif" font-style="italic" font-size="12" fill="#8C857C" text-anchor="start">what lies behind shimmers within what lies before</text><text x="450" y="310" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" fill="#2A2622" text-anchor="start">光随天气、日出日落而变</text><text x="450" y="326" font-family="'EB Garamond',Georgia,serif" font-style="italic" font-size="12" fill="#8C857C" text-anchor="start">and the light shifts with weather, sunrise and sunset</text><line x1="245.0" y1="496" x2="245.0" y2="140.0" stroke="#2A2622" stroke-width="1" marker-start="url(#tick)" marker-end="url(#tick)"/><text x="255.0" y="318.0" font-family="Georgia,serif" font-size="15" fill="#2A2622" transform="rotate(-90 255.0 318.0)" text-anchor="middle" dy="-4">2.4 m</text><text x="360" y="540" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#2A2622" text-anchor="start">双层画布 · 间距 25 cm · U 形底座</text><text x="360" y="554" font-family="'EB Garamond',Georgia,serif" font-style="italic" font-size="10" fill="#8C857C" text-anchor="start">Double canvas · 25 cm apart · U-shaped base</text><text x="40" y="50" font-family="'Noto Serif SC','Songti SC',serif" font-size="20" fill="#2A2622" text-anchor="start">剖面 · 光线</text><text x="40" y="72" font-family="'EB Garamond',Georgia,serif" font-style="italic" font-size="18" fill="#8C857C" text-anchor="start">Section · light</text></svg>