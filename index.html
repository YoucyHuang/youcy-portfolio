<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>黄鈺茜 · Youcy Huang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=Noto+Sans+SC:wght@400;500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<style>
:root{
  --bg:#FFFFFF; --ink:#191817; --ink2:#5E5A55; --ink3:#9A958E; --rule:#E5E1DB; --hair:#F0EDE9; --mat:#F4F3F1;
  --veil:rgba(255,255,255,.46); --bar:rgba(255,255,255,.78);
  /* 取自作品的颜色：本真的朱红、诗影的金、畲山养物的绿、风起东坂的蓝 */
  --c-p:#C8452F; --c-f:#D3951B; --c-d:#5E7F4E; --c-w:#2F5D8A;
  --cn:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --en:"EB Garamond","Garamond","Times New Roman",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --serif:var(--cn);
}
:root:lang(en){--serif:var(--en),var(--cn)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131211; --ink:#EEEAE4; --ink2:#ABA59C; --ink3:#77726B; --rule:#2C2A27; --hair:#201E1C; --mat:#1B1A18;
    --veil:rgba(19,18,17,.5); --bar:rgba(19,18,17,.8);
    --c-p:#E0603F; --c-f:#E8AE3A; --c-d:#86A874; --c-w:#6E9BCB; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131211; --ink:#EEEAE4; --ink2:#ABA59C; --ink3:#77726B; --rule:#2C2A27; --hair:#201E1C; --mat:#1B1A18;
  --veil:rgba(19,18,17,.5); --bar:rgba(19,18,17,.8);
  --c-p:#E0603F; --c-f:#E8AE3A; --c-d:#86A874; --c-w:#6E9BCB; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.85;-webkit-font-smoothing:antialiased}
:lang(en) body{font-family:var(--en);font-size:18px;line-height:1.6}
a{color:inherit}
img{max-width:100%}
button{font:inherit;color:inherit;cursor:pointer}
a:focus-visible,button:focus-visible,input:focus-visible{outline:1px solid var(--ink);outline-offset:4px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}

/* 标签：字距拉开的大写衬线，与作者自己的项目书一致 */
.cap{font-family:var(--en);font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink3);font-weight:400}
.num{font-family:var(--en);font-variant-numeric:lining-nums tabular-nums;letter-spacing:.06em;color:var(--ink3);font-size:13px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--dc,var(--ink));flex:none;vertical-align:middle}

/* ============ 入口页：留白 → 细线 → 水墨晕染（金边）→ 字从墨中浮现 ============ */
.splash{position:fixed;inset:0;z-index:40;overflow:hidden;background:#FBFAF7}
.splash.leaving{background:transparent}
.sp-ink{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.splash.ready .sp-ink{cursor:pointer}
/* 文字和按钮画在画布里；这里是给读屏和键盘用的同一份内容 */
.sp-a11y{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.sp-a11y h1,.sp-a11y p{margin:0}
.sp-a11y button{background:none;border:0;padding:6px 10px}
/* 不支持 WebGL2 时的简版：黑底，字淡入 */
.splash.nogl{background:#0B0B0C;transition:opacity 1.5s ease;opacity:0}
.splash.nogl.show{opacity:1}
.splash.nogl .sp-a11y{position:absolute;inset:0;width:auto;height:auto;clip-path:none;display:grid;place-content:center;justify-items:center;gap:8px;color:#EFE9DE}
.splash.nogl .sp-name{font-family:var(--cn);font-weight:600;font-size:clamp(46px,7vw,104px);letter-spacing:.2em;margin-right:-.2em}
.splash.nogl .sp-en{font-family:var(--en);font-style:italic;font-size:clamp(26px,3.8vw,56px)}
.splash.nogl .sp-pf{font-family:var(--en);font-size:12px;letter-spacing:.55em;color:#C9A24E;text-transform:uppercase}
.splash.nogl .sp-lang{margin-top:28px;font-size:15px;color:rgba(239,233,222,.6)}
.splash.nogl .sp-lang button{color:#EFE9DE}
.splash.nogl .sp-lang button:hover{color:#E8B95A}

/* ============ 页眉页脚 ============ */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);-webkit-backdrop-filter:blur(16px) saturate(1.2);backdrop-filter:blur(16px) saturate(1.2);border-bottom:1px solid var(--rule)}
.top-in{max-width:1440px;margin:0 auto;padding-inline:clamp(16px,4vw,56px);display:flex;align-items:center;justify-content:space-between;gap:12px 28px;min-height:64px;flex-wrap:wrap}
.mark{display:flex;align-items:baseline;gap:12px;text-decoration:none;background:none;border:0;padding:6px 0}
.mark b{font-family:var(--cn);font-weight:600;font-size:18px;letter-spacing:.14em}
.mark i{font-family:var(--en);font-size:16px;color:var(--ink2)}
.nav{display:flex;align-items:center;gap:4px clamp(14px,2.4vw,34px);flex-wrap:wrap}
.nav a{position:relative;text-decoration:none;font-size:14px;color:var(--ink2);padding-block:6px;transition:color .2s}
:lang(en) .nav a{font-size:17px}
.nav a:hover{color:var(--ink)}
.nav a.on{color:var(--ink)}
.nav a.on::after{content:"";position:absolute;left:50%;bottom:-2px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--dc,var(--ink))}
.lang{display:flex;gap:8px;align-items:center;padding-left:clamp(10px,2vw,24px);border-left:1px solid var(--rule)}
.lang button{background:none;border:0;padding:4px 0;font-family:var(--en);font-size:13px;letter-spacing:.14em;color:var(--ink3)}
.lang button[aria-pressed="true"]{color:var(--ink)}
.wrap{max-width:1440px;margin:0 auto;padding-inline:clamp(16px,4vw,56px)}
footer{border-top:1px solid var(--rule);margin-top:40px}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 28px;padding-block:28px 48px;font-size:12.5px;color:var(--ink3)}
.view{animation:fade .6s ease-out}
@keyframes fade{from{opacity:.25}to{opacity:1}}

/* ============ 通用 ============ */
.ph{padding-block:72px 40px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 40px;align-items:end}
.ph h1{margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(36px,4.6vw,64px);line-height:1.1;letter-spacing:.06em}
:lang(en) .ph h1{letter-spacing:0}
.ph h1 small{display:block;margin-top:10px}
.ph p{margin:0;max-width:30em;color:var(--ink2)}
@media (max-width:800px){.ph{grid-template-columns:1fr;padding-block:48px 28px}}
/* 系列 / 栏目切换：做成带封面的大卡片，让人一眼看出“这里还有别的系列” */
.switch{padding-block:22px 4px;border-top:1px solid var(--rule)}
.switch-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.switch-h .cap:first-child{color:var(--ink)}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px}
.tab{display:grid;grid-template-columns:72px minmax(0,1fr) auto;align-items:center;gap:18px;padding:10px 22px 10px 10px;background:var(--bg);border:1px solid var(--rule);text-align:left;color:var(--ink2);transition:border-color .25s,box-shadow .25s,color .25s,transform .25s}
.tab img,.tab .tg{display:block;width:72px;height:72px;object-fit:cover;background:var(--mat);transition:filter .3s,opacity .3s}
.tab .tg{display:grid;place-items:center;font-family:var(--cn);font-size:30px;color:var(--dc)}
.tab .tc{display:grid;gap:4px;min-width:0}
.tab b{font-family:var(--serif);font-weight:400;font-size:clamp(20px,1.9vw,26px);line-height:1.25}
.tab i{font-style:normal;font-size:18px;color:var(--ink3);transition:color .25s,transform .25s}
.tab:hover{border-color:var(--ink3);color:var(--ink);transform:translateY(-2px)}
.tab:hover i{color:var(--dc);transform:translateX(3px)}
.tab:not([aria-pressed="true"]) img{filter:saturate(.55);opacity:.75}
.tab:hover img{filter:none;opacity:1}
.tab[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);box-shadow:inset 0 -3px 0 var(--dc);transform:none;cursor:default}
.tab[aria-pressed="true"] i{color:var(--dc);font-size:11px}
.tab[aria-pressed="true"] .cap{color:var(--dc)}
.modes{display:flex;gap:20px;flex-wrap:wrap}
.modes button{background:none;border:0;border-bottom:1px solid transparent;padding:2px 0;font-family:var(--en);font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink3)}
:lang(zh-CN) .modes button{font-family:var(--sans);font-size:13px;letter-spacing:.12em}
.modes button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.intro{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:24px clamp(32px,6vw,96px);padding-block:48px 40px}
.intro h2{margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(26px,2.8vw,38px);line-height:1.25}
.intro .meta{margin-top:12px;display:grid;gap:4px}
.intro .say{display:grid;gap:1em}
.intro .say p{margin:0;font-family:var(--serif);font-size:16px;line-height:2.05;color:var(--ink)}
:lang(en) .intro .say p{font-size:19px;line-height:1.6}
.intro .say p.line{font-size:clamp(20px,2vw,26px);line-height:1.6}
.bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px 24px;padding-block:14px;border-top:1px solid var(--ink);margin-bottom:28px}
.back{display:inline-block;padding-block:28px 6px;text-decoration:none}
.back:hover{color:var(--ink)}
.more{display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--rule);padding-block:18px 8px;margin-top:40px;font-size:14px}
.more a{text-decoration:none;color:var(--ink2)} .more a:hover{color:var(--ink)}
.empty{padding:28px 0;color:var(--ink2)}

/* ============ 首页 ============ */
.hero{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:28px clamp(32px,6vw,110px);padding-block:clamp(56px,8vw,112px) 48px;align-items:end}
.hero q{display:block;quotes:none;font-family:var(--serif);font-size:clamp(26px,3.3vw,46px);line-height:1.45;letter-spacing:.02em;text-wrap:balance}
:lang(en) .hero q{line-height:1.25}
.hero .by{margin-top:22px}
.hero-side{display:grid;gap:14px;padding-bottom:6px}
.hero-side p{margin:0;color:var(--ink2)}
.hero-side .links{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:6px}
.hero-side .links a{text-decoration:none;display:inline-flex;align-items:center;gap:8px;font-family:var(--serif)}
.hero-side .links a:hover{color:var(--c-p)}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
/* 入口照片是夜里的橘黄灯光（取样约 #B3823F），进首页后留一点它的余温：右上角一团暖光、几处琥珀色细节 */
:root{--amber:#B3823F;--amber-glow:rgba(214,140,58,.20);--amber-glow2:rgba(232,176,92,.14)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--amber:#D9A35C;--amber-glow:rgba(214,130,48,.20);--amber-glow2:rgba(230,160,80,.10)}}
:root[data-theme="dark"]{--amber:#D9A35C;--amber-glow:rgba(214,130,48,.20);--amber-glow2:rgba(230,160,80,.10)}
html{overflow-x:clip}
.home{position:relative;isolation:isolate}
.home::before{content:"";position:absolute;z-index:-1;pointer-events:none;top:-140px;right:calc(clamp(16px,4vw,56px) * -1 - 6vw);
  width:min(78vw,980px);height:min(78vw,760px);
  background:radial-gradient(closest-side at 62% 42%,var(--amber-glow),transparent 72%),radial-gradient(closest-side at 30% 70%,var(--amber-glow2),transparent 70%);
  filter:blur(8px);animation:ember 9s ease-in-out infinite alternate}
@keyframes ember{from{opacity:.75;transform:translate3d(0,0,0) scale(1)}to{opacity:1;transform:translate3d(-2%,1.5%,0) scale(1.04)}}
.home .hero .by{color:var(--amber)}
.home .hero .by.tr{font-family:var(--en);font-style:italic;font-size:clamp(15px,1.35vw,19px);line-height:1.6;letter-spacing:.01em}
:lang(en) .home .hero .by.tr{font-family:var(--cn);font-style:normal;letter-spacing:.06em}
.home .hero .by.tr{position:relative;padding-left:40px}
.home .hero .by.tr::before{position:absolute;left:0;top:.8em;margin:0}
.home .hero .by::before{content:"";display:inline-block;width:28px;height:1px;background:var(--amber);vertical-align:middle;margin-right:10px}
.home .hero-side .cap{color:var(--amber)}
.home .table-h{border-top:0;background:linear-gradient(90deg,var(--amber),var(--rule) 38%) top/100% 1px no-repeat}
#drumNow{color:var(--amber)}
@media (prefers-reduced-motion:reduce){.home::before{animation:none}}
/* 首页滚筒：四张卡片围成一圈，缓缓旋转 */
.drum-wrap{padding-block:8px 96px}
.table-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:14px;border-top:1px solid var(--rule)}
.drum{--cw:clamp(170px,21vw,290px);position:relative;height:calc(var(--cw) * 4 / 3 + 120px);perspective:1500px;perspective-origin:50% 40%;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none;overflow:hidden}
.drum.drag{cursor:grabbing}
.ring{position:absolute;left:50%;top:44px;width:var(--cw);aspect-ratio:3/4;margin-left:calc(var(--cw) / -2);transform-style:preserve-3d}
.card3{position:absolute;inset:0;display:block;overflow:hidden;background:var(--mat);color:#fff;text-decoration:none;backface-visibility:hidden;
  box-shadow:0 2px 4px rgba(0,0,0,.08),0 24px 50px -20px rgba(0,0,0,.4);
  filter:brightness(calc(.55 + .45 * max(var(--f,1), 0))) saturate(calc(.5 + .5 * max(var(--f,1), 0)))}
.card3 img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.card3::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--dc);z-index:2}
.card3::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(10,9,8,.72),rgba(10,9,8,0) 58%)}
.card3 .et{position:absolute;left:0;right:0;bottom:0;z-index:1;display:grid;gap:5px;padding:clamp(14px,1.8vw,24px)}
.card3 .en{font-family:var(--en);font-size:11px;letter-spacing:.22em;text-transform:uppercase;opacity:.85}
.card3 b{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:var(--cn);font-weight:400;font-size:clamp(24px,2.6vw,38px);line-height:1.1;letter-spacing:.1em}
:lang(en) .card3 b{font-family:var(--en);letter-spacing:.02em}
.card3 b i{font-style:normal;font-size:20px;opacity:0;transition:opacity .3s,transform .4s}
.card3 small{font-size:12.5px;opacity:.85}
.card3.front b i{opacity:1}
.card3.front:hover b i{transform:translateX(5px)}
.card3:focus-visible{outline:2px solid #fff;outline-offset:-6px}
/* 地面上的一圈淡影，让滚筒“落”在页面上 */
.drum::after{content:"";position:absolute;left:50%;bottom:26px;width:min(70%,640px);height:34px;transform:translateX(-50%);
  background:radial-gradient(closest-side,rgba(120,72,20,.20),transparent);pointer-events:none}
@media (max-width:640px){.drum{--cw:52vw;perspective:900px}}
.entries{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(10px,1.4vw,20px);padding-block:8px 104px}
.entry{position:relative;display:block;aspect-ratio:3/4;max-width:100%;overflow:hidden;background:var(--mat);text-decoration:none;color:#fff}
.entry img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.4s cubic-bezier(.2,.7,.2,1)}
.entry::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--dc);z-index:2;transform:scaleX(0);transform-origin:left;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.entry::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(10,9,8,.68),rgba(10,9,8,0) 58%)}
.entry .et{position:absolute;left:0;right:0;bottom:0;z-index:1;display:grid;gap:6px;padding:clamp(16px,2vw,28px)}
.entry .en{font-family:var(--en);font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;opacity:.85}
.entry b{display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:var(--cn);font-weight:400;font-size:clamp(28px,3vw,44px);line-height:1.1;letter-spacing:.1em}
:lang(en) .entry b{font-family:var(--en);letter-spacing:.02em}
.entry b i{font-style:normal;font-size:22px;transition:transform .45s}
.entry small{font-size:13px;opacity:.85}
.entry:hover img,.entry:focus-visible img{transform:scale(1.05)}
.entry:hover::before,.entry:focus-visible::before{transform:scaleX(1)}
.entry:hover b i,.entry:focus-visible b i{transform:translateX(6px)}
@media (max-width:980px){.entries{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.entries{grid-template-columns:1fr}.entry{aspect-ratio:4/3}}
.band{display:flex;gap:clamp(6px,.8vw,12px);height:clamp(150px,22vw,320px);margin-inline:calc(clamp(16px,4vw,56px) * -1);padding-inline:clamp(16px,4vw,56px);overflow-x:auto;scrollbar-width:none}
.band::-webkit-scrollbar{display:none}
.band a{flex:none;height:100%;display:block;position:relative}
.band img{height:100%;width:auto;display:block;transition:filter .5s}
.band a .dot{position:absolute;left:10px;bottom:10px;box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.band:hover img{filter:saturate(.55) brightness(1.04)}
.band a:hover img{filter:none}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-block:72px 18px;border-bottom:1px solid var(--rule);margin-bottom:26px}
.sec-title h2{margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(22px,2.2vw,30px)}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px clamp(14px,2vw,28px)}
@media (max-width:980px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{text-decoration:none;display:grid;gap:12px}
.card .im{position:relative;aspect-ratio:4/5;max-width:100%;overflow:hidden;background:var(--mat)}
.card .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.4s cubic-bezier(.2,.7,.2,1)}
.card:hover .im img{transform:scale(1.04)}
.card .im.text{display:grid;align-content:end;padding:22px}
.card .im.text b{font-family:var(--serif);font-weight:400;font-size:clamp(18px,1.8vw,24px);line-height:1.5}
.card .t{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:17px}
:lang(en) .card .t{font-size:20px}
.card .k{margin-top:-8px;font-size:12.5px;color:var(--ink3)}
.card:hover .t{color:var(--dc)}
.tools{display:flex;flex-wrap:wrap;gap:12px 26px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px 20px}
.chip{background:none;border:0;border-bottom:1px solid transparent;padding:2px 0;display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink3)}
:lang(en) .chip{font-size:16px}
.chip .dot{opacity:.4}
.chip[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.chip[aria-pressed="true"] .dot{opacity:1}
.search{font:inherit;font-size:13.5px;background:transparent;color:var(--ink);border:0;border-bottom:1px solid var(--rule);padding:4px 0;width:200px;max-width:100%}
.search:focus{outline:none;border-bottom-color:var(--ink)}
.search::placeholder{color:var(--ink3)}
.rows{margin-bottom:40px}

/* ============ 绘画 ============ */
.pgroup{padding-bottom:72px}
.pg-h{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:baseline;padding-block:12px 26px;border-top:1px solid var(--rule);font-size:13px;color:var(--ink2)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:52px clamp(18px,2.4vw,36px)}
.pcard{text-decoration:none;display:grid;gap:12px}
.mat{position:relative;aspect-ratio:1;max-width:100%;background:var(--mat)}
.mat img{position:absolute;inset:10%;width:80%;height:80%;object-fit:contain;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.pcard:hover .mat img{transform:scale(1.035)}
.pcap{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:baseline}
.pcap b{font-family:var(--serif);font-weight:400;font-size:15px}
:lang(en) .pcap b{font-size:18px}
.pcard:hover .pcap b{color:var(--dc)}
.scroll{--h:420px;direction:rtl;display:flex;align-items:flex-end;gap:clamp(44px,6vw,100px);overflow-x:auto;padding:64px clamp(24px,4vw,64px) 44px;background:var(--mat);scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
.scroll-item{direction:ltr;flex:none;display:flex;align-items:flex-end;gap:16px;text-decoration:none}
.scroll-item img{display:block;height:var(--h);width:auto}
.tiba{writing-mode:vertical-rl;display:flex;gap:12px;height:var(--h);font-family:var(--cn);font-size:12px;color:var(--ink3);letter-spacing:.16em}
.tiba b{font-weight:400;color:var(--ink);font-size:14px;letter-spacing:.24em}
:lang(en) .tiba{font-family:var(--en);font-size:11px;letter-spacing:.18em;text-transform:uppercase}
:lang(en) .tiba b{text-transform:none;font-size:15px;letter-spacing:.04em}
.scroll-item:hover .tiba b{color:var(--dc)}
.hint{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;padding-block:14px 88px;margin:0}
@media (max-width:640px){.scroll{--h:260px}}
.scale{--k:4.4px;overflow-x:auto;background:var(--mat);padding:64px clamp(24px,4vw,64px) 30px;scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
.wall{display:flex;align-items:flex-end;gap:calc(var(--k) * 8);width:max-content;padding-bottom:32px;border-bottom:1px solid var(--ink)}
.sw{position:relative;flex:none;display:block;width:calc(var(--w) * var(--k));height:calc(var(--h) * var(--k))}
.sw img{display:block;width:100%;height:100%;object-fit:cover;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.sw .num{position:absolute;left:0;top:calc(100% + 10px);white-space:nowrap;font-size:11px}
.ruler{position:relative;margin-top:22px;width:calc(var(--k) * 100);height:26px}
.ruler i{position:absolute;left:0;right:0;top:0;height:6px;border:1px solid var(--ink2);border-top:0}
.ruler i::after{content:"";position:absolute;left:50%;top:0;height:4px;border-left:1px solid var(--ink2)}
.ruler span{position:absolute;top:10px;font-family:var(--en);font-size:11px;color:var(--ink3);white-space:nowrap}
.ruler span:nth-of-type(2){left:50%;transform:translateX(-50%)}
.ruler span:nth-of-type(3){left:100%;transform:translateX(-50%)}
@media (max-width:640px){.scale{--k:2.6px}}
.pseq{display:grid;gap:clamp(72px,10vw,150px);padding-block:40px 120px}
.pw{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px clamp(28px,4vw,64px);align-items:end}

.pw .phb{width:auto;max-width:100%}
.pw img{display:block;width:auto;height:auto;max-width:100%;max-height:min(84vh,980px)}

/* b 系列：深色展厅，背景铺满整屏宽 */

/* 绘画模块：深灰展厅。墙面上亮下暗，每幅画头顶一束偏暖的聚光 */
body{transition:background-color .6s ease}
/* 底色直接写在 html 和 body 上；渐变放在单独一层固定的伪元素里，图很多时浏览器也不会退回白底 */
html.gallery{background:#232220}
body.gallery{--bg:#262523;--ink:#ECE8E1;--ink2:#B5AFA6;--ink3:#857F76;--rule:#3B3936;--hair:#312F2C;--mat:#2E2C29;--bar:rgba(34,33,31,.94);color-scheme:dark;background:transparent}
body.gallery::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse 130% 70% at 50% -10%,#3A3835 0,#2A2927 45%,#1E1D1C 100%)}
body.gallery .tab{background:#2A2927}
body.gallery .pw .phb,body.gallery .pwc .phb,body.gallery .pd-img .zoom{position:relative;z-index:0}
body.gallery .pw .phb::before,body.gallery .pwc .phb::before,body.gallery .pd-img .zoom::before{content:"";position:absolute;z-index:-1;pointer-events:none;
  inset:-26% -22% -10% -22%;
  background:radial-gradient(52% 62% at 50% 6%,rgba(255,236,204,.22),rgba(255,228,186,.08) 46%,rgba(255,228,186,0) 74%)}
body.gallery .pw img,body.gallery .pwc img{box-shadow:0 26px 40px -18px rgba(0,0,0,.65),0 2px 6px rgba(0,0,0,.35)}
body.gallery .pd-img{background:transparent}
body.gallery .pdet img{box-shadow:0 8px 16px -6px rgba(0,0,0,.6)}
body.gallery .framed .pw .phb{box-shadow:inset 0 0 0 1px rgba(168,138,82,.7),0 0 0 1px rgba(255,255,255,.05),0 30px 60px -22px rgba(0,0,0,.75)}
/* 本真：一行一张，画与画之间留得更开，配极简古典画框（深胡桃木细框 + 一线金 + 象牙白卡纸） */

  box-shadow:inset 0 0 0 1px rgba(168,138,82,.7),0 1px 0 rgba(255,255,255,.06),0 22px 44px -22px rgba(0,0,0,.45)}

.cmt-row{display:grid;grid-template-columns:1fr 1.4fr;gap:12px 24px}

        <img src="${e.img}" alt="" draggable="false"><span class="et"><span class="en">${pad(i+1)} · ${T.nav[e.k][1]}</span><b>${L(T.nav[e.k])}<i aria-hidden="true">→</i></b><small>${e.sub()}</small></span></a>`).join('')}</div></div>

let drumStop=null;
function initDeck(){
  if(drumStop){drumStop();drumStop=null}
  const drum=document.getElementById('drum'),ring=document.getElementById('ring');if(!drum)return;
  const cards=[...ring.children],n=cards.length,step=360/n,calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let ang=Math.random()*360,vel=0,hover=false,drag=null,auto=false,moved=false,raf=0,last=performance.now(),R=0,front=-1;
  const SPEED=calm?0:-14;  /* 每秒转几度（约 25 秒一圈） */
  function size(){const cw=cards[0].offsetWidth;R=Math.round(cw/2/Math.tan(Math.PI/n)+cw*.18);drum.style.setProperty('--R',R+'px')}
  function paint(){
    ring.style.transform=`translateZ(${-R}px) rotateY(${ang}deg)`;
    let best=-2,bi=0;
    cards.forEach((c,i)=>{const a=(i*step+ang)*Math.PI/180,f=Math.cos(a);  /* f=1 正对，-1 背面 */
      c.style.transform=`rotateY(${i*step}deg) translateZ(${R}px)`;
      c.style.setProperty('--f',f.toFixed(3));c.style.zIndex=Math.round((f+1)*10);
      if(f>best){best=f;bi=i}});
    if(bi!==front){front=bi;cards.forEach((c,i)=>{c.classList.toggle('front',i===bi);c.tabIndex=i===bi?0:-1});
      const el=document.getElementById('drumNow');if(el)el.textContent=`${pad(bi+1)} / ${pad(n)} · ${L(T.nav[ENTRY[bi].k])}`}
  }
  function tick(t){
    const dt=Math.min(.05,(t-last)/1000);last=t;
    if(!drag&&!auto){
      if(Math.abs(vel)>.5){ang+=vel*dt;vel*=Math.pow(.04,dt)}        /* 拖完的惯性 */
      else ang+=SPEED*dt;   /* 一直转，鼠标停上去也不停 */
    }
    paint();raf=requestAnimationFrame(tick);
  }
  drum.addEventListener('pointerdown',e=>{if(e.button>0||auto)return;drag={x:e.clientX,a:ang,t:performance.now(),lx:e.clientX};moved=false});
  drum.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x;
    if(!moved&&Math.abs(dx)>6){moved=true;drum.setPointerCapture(e.pointerId);drum.classList.add('drag')}
    if(moved){const now=performance.now();ang=drag.a+dx*.35;vel=(e.clientX-drag.lx)*.35/Math.max(.016,(now-drag.t)/1000);drag.t=now;drag.lx=e.clientX}});
  const end=()=>{if(!drag)return;drag=null;drum.classList.remove('drag')};
  drum.addEventListener('pointerup',end);drum.addEventListener('pointercancel',end);
  /* 点到侧面的卡片：先转到正面，不跳转；点正面的才进入 */
  cards.forEach((c,i)=>c.addEventListener('click',e=>{
    if(moved){e.preventDefault();moved=false;return}
    if(i!==front){e.preventDefault();const target=-i*step;let d=((target-ang)%360+540)%360-180;vel=0;
      const a0=ang,t0=performance.now();auto=true;
      const go=t=>{const k=Math.min(1,(t-t0)/600),ease=1-Math.pow(1-k,3);ang=a0+d*ease;if(k<1)requestAnimationFrame(go);else auto=false};requestAnimationFrame(go)}
  }));
  drum.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();ang+=e.key==='ArrowLeft'?step:-step;
    setTimeout(()=>cards[front]&&cards[front].focus(),0)}});
  size();paint();raf=requestAnimationFrame(tick);
  const ro=window.ResizeObserver?new ResizeObserver(size):null;if(ro)ro.observe(drum);
  drumStop=()=>{cancelAnimationFrame(raf);if(ro)ro.disconnect()};
}

    lb.addEventListener('click',e=>{const b=e.target.closest('button');if(b&&b.dataset.go)step(+b.dataset.go);else if(b&&b.id==='lbClose')closeView();else if(!e.target.closest('img'))closeView()});

    lb.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>40)step(dx<0?1:-1);x0=null});}

function paintView(){const lb=document.getElementById('lb'),it=vw.list[vw.i];

  const nx=vw.list[vw.i+1];if(nx){const im=new Image();im.src=nx.src}}
function step(d){if(!vw)return;const j=vw.i+d;if(j<0||j>=vw.list.length)return;vw.i=j;paintView()}

  if(e.target.closest&&e.target.closest('input,textarea'))return;

/* ================= 入口页：留白 → 细线 → 水墨晕染（金边）→ 字从墨中浮现；鼠标划过起水波，点击墨散入站 ================= */
const splash=document.getElementById('splash');

const INK=(()=>{
  const D={blank:1000,line:800,pause:250,spread:3000,text:1500,exit:1700};   /* 各段时长（毫秒） */

    setLang(l);splash.classList.add('leaving');
    if(!gl){splash.classList.remove('show');setTimeout(finish,calm?0:1500);return}
    splat(exitPos[0],exitPos[1],-4,5);

  }
  if(!gl){
    splash.classList.add('nogl');
    return{start(){exitAt=0;splash.classList.remove('show');setTimeout(()=>splash.classList.add('show'),calm?0:D.blank)},leave};
  }

  const VS=`#version 300 es
  void main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);gl_Position=vec4(p*2.-1.,0.,1.);}`;
  const FS=`#version 300 es
  precision highp float;
  uniform vec2 uRes;uniform float uDpr,uTime,uLine,uSpread,uTextP,uExit,uHoverAmt,uCell,uRippleOn;
  uniform vec2 uExitPos,uGrid;uniform vec4 uHover;uniform sampler2D uTextTex,uRipple,uRimTex;

  float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
  float noise(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.-2.*f);

  float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*noise(p);p=p*2.03+17.1;a*=.5;}return v;}
  /* 金色：有明确色相，最亮处也不过曝成白 */
  vec3 goldAt(vec2 q,float k){
    float sh=smoothstep(.35,.85,fbm(q/42.+vec2(uTime*.22,k)));
    vec3 c=mix(vec3(.70,.50,.17),vec3(.94,.76,.38),sh);
    float sp=step(.993,hash(floor(q/2.5)+floor(uTime*4.)));   /* 稀疏、柔和的细碎金点 */

  }
  float rip(vec2 q){return texture(uRipple,(q/uCell+.5)/uGrid).r;}
  void main(){
    vec2 Q=vec2(gl_FragCoord.x,uRes.y-gl_FragCoord.y)/uDpr,S=uRes/uDpr,C=S*.5;   /* CSS 像素，左上原点 */

let lastLog={p:null,t:0},firstLog=true;
function logVisit(path){
  if(!sbOn||CLIENT.bot||noTrack())return;
  const now=Date.now();if(path===lastLog.p&&now-lastLog.t<4000)return;lastLog={p:path,t:now};
  rpc('log_visit',{v:{vid:VID,path,platform:CLIENT.platform,src:CLIENT.src,referrer:firstLog&&document.referrer||null,device:CLIENT.device,
    ua:navigator.userAgent,lang:navigator.language,screen:`${screen.width}×${screen.height}`}},true).catch(()=>{});
  firstLog=false;
}

/* 留言：放在每篇文章、随记页、诗页的末尾 */
const cmBox=thread=>sbOn?`<section class="cmt" data-thread="${esc(thread)}">
  <div class="cmt-h"><span class="cap">${L(T.cm.title)}</span><span class="num" data-cmt-n></span></div>
  <ol class="cmt-list" data-cmt-list></ol>
  <button class="btn" data-cmt-open>${L(T.cm.write)}</button>
  <form class="cmt-form" hidden>
    <textarea name="body" rows="4" maxlength="2000" required placeholder="${L(T.cm.ph)}"></textarea>
    <div class="cmt-row"><input name="name" maxlength="40" placeholder="${L(T.cm.name)}" value="${esc(store.cmName||'')}" autocomplete="nickname">
      <input name="contact" maxlength="100" placeholder="${L(T.cm.contact)}" value="${esc(store.cmContact||'')}"></div>
    <label class="cmt-anon"><input type="checkbox" name="anonymous"><span>${L(T.cm.anon)}<small>${L(T.cm.anonTip)}</small></span></label>
    <input name="website" class="cmt-hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <div class="cmt-act"><button class="btn" type="submit">${L(T.cm.send)}</button><span class="cap" data-cmt-msg aria-live="polite"></span></div>
    <p class="cmt-note">${L(T.cm.note)}</p>
  </form>
</section>`:'';
const cmDate=s=>{const d=new Date(s);return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}`};
const cmItem=c=>`<li><div class="cmt-m"><b>${c.name?esc(c.name):L(T.cm.anonName)}</b><span class="num">${cmDate(c.at)}</span></div><p>${esc(c.body)}</p></li>`;
function initComments(){
  view.querySelectorAll('.cmt').forEach(box=>{
    const list=box.querySelector('[data-cmt-list]'),n=box.querySelector('[data-cmt-n]');
    rpc('get_comments',{t:box.dataset.thread}).then(rows=>{
      list.innerHTML=rows.map(cmItem).join('');n.textContent=rows.length?L(T.cm.count)(rows.length):'';
    }).catch(()=>{});
  });
}
view.addEventListener('submit',e=>{
  const f=e.target.closest('.cmt-form');if(!f)return;e.preventDefault();
  const box=f.closest('.cmt'),msg=f.querySelector('[data-cmt-msg]'),btn=f.querySelector('[type=submit]'),v=k=>f.elements[k].value.trim();
  if(v('website'))return;   /* 机器人才会填这个隐藏框 */
  if(!v('body')){f.elements.body.focus();return}
  const anonymous=f.elements.anonymous.checked;
  store.cmName=v('name');store.cmContact=v('contact');save();
  btn.disabled=true;msg.textContent=L(T.cm.sending);
  rpc('add_comment',{c:{thread:box.dataset.thread,body:v('body'),name:v('name'),contact:v('contact'),anonymous,vid:VID,platform:CLIENT.platform,device:CLIENT.device,ua:navigator.userAgent}})
    .then(c=>{
      const list=box.querySelector('[data-cmt-list]');list.insertAdjacentHTML('beforeend',cmItem(c));
      box.querySelector('[data-cmt-n]').textContent=L(T.cm.count)(list.children.length);
      f.elements.body.value='';msg.textContent=L(T.cm.sent);f.hidden=true;
      box.querySelector('[data-cmt-open]').hidden=false;list.lastElementChild.scrollIntoView({block:'nearest',behavior:'smooth'});
    })
    .catch(err=>{msg.textContent=/rate/.test(err.message)?L(T.cm.rate):L(T.cm.fail)})
    .finally(()=>{btn.disabled=false});
});

chrome();route(false);
if(location.hash.length>1){splash.hidden=true}else{startSplash()}
</script>
